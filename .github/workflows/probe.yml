# Development aid: runs probe/probe.py and prints what public pages look like, to write and check the scrapers.
# No secrets, no database, nothing is stored. Started by hand (Actions > Probe public pages > Run workflow).
name: Probe public pages

on:
  workflow_dispatch:  # started by hand only: a failing look at a page should not look like a failed update

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python probe/probe.py
